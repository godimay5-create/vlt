<style>
:root{--navy:#094488;--navy2:#0b4f9c;--azul-claro:#e8f1fb;--txt:#0f172a;--txt2:#334155;--mut:#64748b;--borda:#e2e8f0;--borda2:#cbd5e1;
--fundo:#f3f5f8;--branco:#fff;--bad:#b91c1c;--warn:#b45309;--ok:#047857;--fs:15px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:var(--fs);color:var(--txt);background:var(--fundo)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--borda2);background:#fff;color:var(--txt2);padding:7px 13px;font-weight:600}
button:hover{background:#f1f5f9}
button.pri{background:var(--navy);border-color:var(--navy);color:#fff}
button.pri:hover{background:var(--navy2)}
button.sec{background:#fff}
button.ico{padding:6px 11px;font-size:1.1em;line-height:1}
button.grande{padding:11px;font-size:1.05em}
button:disabled{opacity:.45;cursor:default}
input,select{font:inherit;color:var(--txt);border:1px solid var(--borda2);border-radius:8px;padding:7px 9px;background:#fff}
input:focus,select:focus{outline:2px solid #94b8e4;border-color:var(--navy)}
.mut{color:var(--mut)}
.erro{color:var(--bad);font-weight:600}
.flex1{flex:1}
/* telas de carga e login */
.tela-centro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--fundo)}
.logo-grande{height:70px}
.barra-carga{width:280px;height:6px;border-radius:3px;background:#dbe4ef;overflow:hidden}
.barra-carga div{width:40%;height:100%;background:var(--navy);border-radius:3px;animation:vai 1.2s ease-in-out infinite}
@keyframes vai{0%{margin-left:-40%}100%{margin-left:100%}}
.cartao-login{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:34px 38px;width:min(420px,92vw);display:flex;flex-direction:column;gap:14px}
.cartao-login h1{margin:0;font-size:1.5em}
.cartao-login label{display:flex;flex-direction:column;gap:5px;font-weight:600;color:var(--txt2)}
.cartao-login input{padding:10px 12px}
.logo-login{height:46px;align-self:flex-start}
/* topo */
#app{height:100%;display:flex;flex-direction:column}
#topo{display:flex;align-items:center;gap:12px;padding:9px 18px;background:#fff;border-bottom:1px solid var(--borda);flex-wrap:wrap}
.logo-topo{height:36px}
.topo-titulo{font-weight:600;color:var(--txt2);font-size:1.05em;white-space:nowrap}
.busca-topo{flex:1;min-width:180px;max-width:520px}
.busca-topo input{width:100%;background:#f6f7f9;border-color:var(--borda);padding:9px 12px}
.comp{display:flex;align-items:center;gap:4px;border:1px solid var(--borda);border-radius:10px;padding:3px 6px}
.comp-rot{font-size:.72em;font-weight:700;color:var(--mut);padding:0 4px}
.comp-mes{border:none;font-weight:700;font-size:1.05em;padding:4px 8px;min-width:96px;color:var(--txt)}
.comp-picker{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:none;padding:0}
.comp{position:relative}
.nuvem{display:flex;align-items:center;gap:7px}
.nuvem .ponto{width:9px;height:9px;border-radius:50%;background:#94a3b8}
.nuvem.ok .ponto{background:#10b981}.nuvem.salvando .ponto{background:#f59e0b}.nuvem.erro .ponto{background:#ef4444}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--borda);border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.12);
 min-width:260px;padding:6px;z-index:30;display:flex;flex-direction:column}
.menu button{border:none;text-align:left;border-radius:7px;font-weight:500}
.menu-user{padding:8px 12px;color:var(--mut);font-size:.9em;border-bottom:1px solid var(--borda);margin-bottom:4px}
/* corpo */
#corpo{flex:1;display:flex;flex-direction:column;min-height:0}
#mestre{background:#fff;border-bottom:1px solid var(--borda);display:flex;flex-direction:column;min-height:0;flex:0 0 auto}
#mestre-cheio{display:flex;flex-direction:column;min-height:0;height:100%}
#mestre.compacto{height:auto!important}
#divisor{height:7px;cursor:row-resize;background:var(--borda);flex:0 0 auto}
#divisor:hover{background:#94a3b8}
.filtros{display:flex;align-items:center;gap:8px;padding:10px 16px 8px;flex-wrap:wrap}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips button{border-radius:999px;background:#f1f5f9;border-color:transparent;padding:5px 13px;font-size:.93em}
.chips button.on{background:var(--txt);color:#fff}
.tabela-wrap{flex:1;overflow:auto;min-height:0;padding:0 16px}
table.grade{width:100%;border-collapse:collapse;font-size:.95em}
.grade th{position:sticky;top:0;background:#f8fafc;color:var(--mut);font-size:.85em;font-weight:700;text-align:left;padding:8px 9px;border-bottom:1px solid var(--borda2);
 cursor:pointer;white-space:nowrap;user-select:none;z-index:1}
.grade th.n,.grade td.n{text-align:right}
.grade th.ord-asc::after{content:' ▲'}.grade th.ord-desc::after{content:' ▼'}
.grade td{padding:7px 9px;border-bottom:1px solid #eef1f5;white-space:nowrap}
.grade tbody tr{cursor:pointer}
.grade tbody tr:hover{background:#f6f9fd}
.grade tbody tr.sel{background:#dbe8f7}
.grade tr.fora td{color:#94a3b8}
.grade td.emp{font-weight:700;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.grade td.pend{max-width:320px;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}.c-ok{color:var(--ok)}.b{font-weight:700}
.totais{padding:7px 18px 9px;color:var(--txt2);font-size:.9em}
.barra-compacta{display:flex;align-items:center;gap:8px;padding:8px 16px}
.c-info{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-info b{font-size:1.08em}
/* detalhe */
#detalhe{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.vazio{margin:auto;color:var(--mut);font-size:1.1em}
#emp{display:flex;flex-direction:column;min-height:100%}
.cab{display:flex;align-items:center;gap:14px;padding:12px 22px 8px;flex-wrap:wrap}
.cab h2{margin:0;font-size:1.35em}
.cab-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;border-radius:999px;padding:3px 11px;font-size:.84em;font-weight:700;background:#f1f5f9;color:#475569}
.chip.erro{background:#fef2f2;color:var(--bad)}.chip.atencao{background:#fffbeb;color:#92400e}.chip.ok{background:#ecfdf5;color:var(--ok)}.chip.info{background:var(--azul-claro);color:var(--navy)}
.abas{display:flex;align-items:center;gap:6px;padding:6px 20px 10px;border-bottom:1px solid var(--borda);background:#fff}
.abas button{border:none;border-radius:999px;padding:8px 20px;font-size:1.02em;background:transparent}
.abas button.on{background:var(--navy);color:#fff}
.aviso-desktop{font-size:.85em}
.pagina{padding:14px 18px;flex:1}
/* resumo */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:12px 14px}
.kpi .r{font-size:.78em;font-weight:700;color:var(--mut);letter-spacing:.3px;text-transform:uppercase}
.kpi .v{font-size:1.35em;font-weight:700;margin-top:4px}
.kpi .s{font-size:.85em;color:var(--mut);margin-top:2px}
.bloco{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.bloco h3{margin:0 0 10px;font-size:1em;text-transform:uppercase;letter-spacing:.4px;color:var(--txt2)}
.pend-item{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid #f1f5f9;cursor:pointer}
.pend-item:hover{background:#f8fafc}
/* apuração */
.ap-barra{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.passos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.passos button{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:9px 14px}
.passos button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.faixa{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--borda);border-radius:12px;margin-bottom:8px;overflow:hidden}
.faixa>div{padding:7px 14px;border-right:1px solid #ecebe7}
.faixa>div:first-child{background:#f8fafc}
.faixa .r{font-size:.74em;font-weight:700;color:var(--mut);letter-spacing:.4px;text-transform:uppercase}
.faixa .v{font-size:1.2em;font-weight:700}
.faixa .s{font-size:.82em;color:var(--mut)}
.etapa{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:14px 16px;flex:1;min-height:260px}
.rodape-ap{display:flex;align-items:center;gap:10px;padding:10px 0 4px}
.drop{border:2px dashed var(--borda2);border-radius:12px;padding:28px;text-align:center;color:var(--mut);background:#f8fafc}
.drop.sobre{border-color:var(--navy);background:var(--azul-claro);color:var(--navy)}
table.form{width:100%;border-collapse:collapse}
.form th{font-size:.82em;color:var(--mut);text-align:left;padding:6px;border-bottom:1px solid var(--borda)}
.form td{padding:4px 6px;border-bottom:1px solid #f1f5f9}
.form input[type=text],.form input:not([type]){width:100%}
.form input.n{text-align:right}
.form td.c{text-align:center}
.linha-campos{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin:12px 0}
.linha-campos label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9em;color:var(--txt2)}
.origem{font-size:.8em;color:var(--mut)}
/* HTML vindo do motor (memória, validação, histórico) */
.doc{font-size:.95em;line-height:1.45}
.doc table{border-collapse:collapse}
.doc td,.doc th{padding:4px 8px}
.doc th{background:#f1f5f9;color:var(--mut);font-size:.85em;text-align:left}
.doc .n{text-align:right}.doc .tot{background:#e2e8f0;font-weight:700}.doc .mut{color:var(--mut)}
.doc .bad{color:var(--bad);font-weight:700}.doc .okc{color:var(--ok);font-weight:700}.doc .formula{background:#f1f5f9}
.doc h3{font-size:.95em;text-transform:uppercase;margin:16px 0 6px;color:#1e293b}.doc h4{font-size:1.05em;margin:16px 0 6px}
.doc a{color:var(--navy);font-weight:700;text-decoration:none}
.doc a:hover{text-decoration:underline}
/* modo ampliado */
body.ampliado #mestre,body.ampliado #divisor,body.ampliado #cab,body.ampliado #abas{display:none!important}
/* toast e modal */
#toast{position:fixed;right:18px;bottom:18px;background:var(--txt);color:#fff;padding:12px 16px;border-radius:10px;max-width:420px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#modal-fundo{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:40}
#modal{background:#fff;border-radius:14px;padding:20px 22px;width:min(560px,94vw);max-height:88vh;overflow:auto}
#modal h3{margin:0 0 10px}
#modal textarea{width:100%;min-height:110px;font:inherit;padding:9px;border:1px solid var(--borda2);border-radius:8px}
.modal-bts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
@media (max-width:900px){.col-cnpj{display:none}.passos{grid-template-columns:repeat(3,1fr)}.faixa{grid-template-columns:repeat(2,1fr)}.topo-titulo{display:none}}

</style>
</head>

<script id="codigo-worker" type="text/plain">
/* Worker do motor: carrega o Pyodide + o motor do Validador (motor.zip) e executa as chamadas da tela
   sem travar a página. Mensagens: {id, fn, args} → {id, ok, valor | erro}. */
const PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/';
importScripts(PYODIDE + 'pyodide.js');

let web = null;
let pronto = null;

async function iniciar(versao, motor) {
  self.postMessage({ tipo: 'progresso', txt: 'Carregando o Python no navegador…' });
  const py = await loadPyodide({ indexURL: PYODIDE });
  self.postMessage({ tipo: 'progresso', txt: 'Carregando o motor de cálculo…' });
  let dados = motor;                       // versão de arquivo único: o motor vem junto do index.html
  if (!dados) {
    const r = await fetch('/motor.zip?v=' + encodeURIComponent(versao || ''));
    if (!r.ok) throw new Error('Não consegui baixar o motor (motor.zip).');
    dados = new Uint8Array(await r.arrayBuffer());
  }
  py.unpackArchive(dados, 'zip', { extractDir: '/app' });
  py.runPython("import sys; sys.path.insert(0, '/app')");
  self.py = py;
  web = py.pyimport('web');
  self.postMessage({ tipo: 'progresso', txt: 'Motor pronto.' });
}

async function garantirPdf() {
  // PDF do PGDAS-D: o motor usa pypdf (puro Python), instalado só quando aparece um PDF
  if (self._pypdf) return;
  await self.py.loadPackage('micropip');
  const micropip = self.py.pyimport('micropip');
  try { await micropip.install(self.location.origin + '/pypdf-5.9.0-py3-none-any.whl'); }   // cópia no próprio site
  catch (_) { await micropip.install('pypdf'); }                                            // senão, do PyPI
  self._pypdf = true;
}

self.onmessage = async (ev) => {
  const { id, fn, args, versao, motor } = ev.data;
  try {
    if (fn === '__iniciar') {
      pronto = pronto || iniciar(versao, motor);
      await pronto;
      return self.postMessage({ id, ok: true, valor: null });
    }
    await pronto;
    let valor;
    if (fn === 'importar') {
      const lista = args[0];
      if (lista.some(([n]) => /\.(pdf|zip)$/i.test(n))) await garantirPdf();
      const pyLista = self.py.toPy(lista.map(([n, b]) => [n, b]));
      valor = web.importar(pyLista);
      pyLista.destroy();
    } else if (fn === 'iniciar') {
      valor = web.iniciar(args[0], args[1], args[2], (cfg) => self.postMessage({ tipo: 'cfg', cfg }));
    } else {
      valor = web[fn](...args);
    }
    self.postMessage({ id, ok: true, valor });
  } catch (e) {
    self.postMessage({ id, ok: false, erro: String(e && e.message || e) });
  }
};

</script>

// ------------------------------------------------------------------ motor (worker com Pyodide)
const worker = new Worker(URL.createObjectURL(new Blob([document.getElementById('codigo-worker').textContent], { type: 'text/javascript' })));
const MOTOR = Uint8Array.from(atob(document.getElementById('motor-b64').textContent.trim()), (c) => c.charCodeAt(0));
let seq = 0;
const esperando = new Map();
worker.onmessage = (ev) => {
  const d = ev.data;
  if (d.tipo === 'progresso') return setCarga(d.txt);
  if (d.tipo === 'cfg') { try { localStorage.setItem('vt_cfg', d.cfg); } catch (_) {} return; }
  const p = esperando.get(d.id);
  if (!p) return;
  esperando.delete(d.id);
  d.ok ? p.res(d.valor) : p.rej(new Error(d.erro));
};
function chamar(fn, ...args) {
  return new Promise((res, rej) => {
    const id = ++seq;
    esperando.set(id, { res, rej });
    worker.postMessage(fn === '__iniciar' ? { id, fn, args, versao: CONFIG.versao, motor: MOTOR } : { id, fn, args, versao: CONFIG.versao });
  });
}
async function M(fn, ...args) {
  const v = await chamar(fn, ...args);
  return v == null ? null : JSON.parse(v);
}

// ------------------------------------------------------------------ Supabase: leitura paginada
async function lerTudo(tabela, colunas, ordem, lote) {
  const out = [];
  for (let i = 0; ; i += lote) {
    const { data, error } = await sb.from(tabela).select(colunas).order(ordem).range(i, i + lote - 1);
    if (error) throw new Error(traduz(error.message, tabela));
    out.push(...data);
    if (data.length < lote) return out;
  }
}
function traduz(m, tabela) {
  if (/Invalid login credentials/.test(m)) return 'E-mail ou senha não conferem (usuário de Authentication → Users do Supabase).';
  if (/Email not confirmed/.test(m)) return 'Este e-mail ainda não foi confirmado no Supabase.';
  if (/JWT expired/.test(m)) return 'A sessão expirou. Entre de novo.';
  if (/does not exist|Could not find the table/.test(m)) return `A tabela "${tabela}" não existe no banco.`;
  if (/permission denied|row-level security/.test(m)) return 'Sem permissão no banco: confira se está logado e as políticas do seguranca_supabase.sql.';
  return m;
}

// ------------------------------------------------------------------ envio para a nuvem (mesmo formato do .exe)
let tEnvio = null, enviando = false, sujo = false;
function setNuvem(st, det = '') {
  const b = $('#bt-nuvem');
  b.className = 'nuvem ' + st;
  $('#nuvem-txt').textContent = { ok: 'Salvo na nuvem', salvando: 'Salvando…', pendente: 'Alterações pendentes', erro: 'Erro ao salvar' }[st] || st;
  b.title = det || 'Sincronização com a nuvem (simples_dados)';
}
function marcarSujo() {
  sujo = true; setNuvem('pendente');
  clearTimeout(tEnvio); tEnvio = setTimeout(enviar, 1200);
}
async function enviar() {
  if (enviando) { clearTimeout(tEnvio); tEnvio = setTimeout(enviar, 800); return; }
  enviando = true;
  let pac = null;
  try {
    pac = await M('pacote');
    sujo = false;
    if (!pac || (!pac.sobe.length && !pac.apaga.length)) { setNuvem('ok'); return; }
    setNuvem('salvando');
    let i = 0;
    while (i < pac.sobe.length) {
      const lote = []; let t = 0;
      while (i < pac.sobe.length && (!lote.length || t + pac.sobe[i].txt.length < 1.5e6)) {
        const x = pac.sobe[i++]; t += x.txt.length;
        lote.push({ chave: x.chave, dados: JSON.parse(x.txt), atualizado_em: x.atualizado_em });
      }
      const { error } = await sb.from(CONFIG.tabelaNuvem).upsert(lote, { onConflict: 'chave' });
      if (error) throw new Error(traduz(error.message, CONFIG.tabelaNuvem));
    }
    if (pac.apaga.length) {
      const { error } = await sb.from(CONFIG.tabelaNuvem).delete().in('chave', pac.apaga);
      if (error) throw new Error(traduz(error.message, CONFIG.tabelaNuvem));
    }
    await M('confirmar', JSON.stringify({ sobe: pac.sobe.map((x) => [x.chave, x.h]), apaga: pac.apaga }));
    setNuvem(sujo ? 'pendente' : 'ok');
  } catch (e) {
    if (pac) await M('falhou', JSON.stringify(pac.cats));
    setNuvem('erro', String(e.message || e));
    avisar('Não salvou na nuvem: ' + (e.message || e) + ' — tento de novo em 20 s.', 6000);
    clearTimeout(tEnvio); tEnvio = setTimeout(enviar, 20000);
  } finally { enviando = false; }
}
window.addEventListener('beforeunload', (e) => {
  if ($('#bt-nuvem').classList.contains('pendente') || $('#bt-nuvem').classList.contains('salvando') || enviando) { e.preventDefault(); e.returnValue = ''; }
});
/** Executa uma ação que muda dados e, depois, envia para a nuvem e redesenha. */
async function mudar(fn, ...args) {
  const r = await M(fn, ...args);
  if (r && r.ok === false) { avisar(r.erro, 5000); return r; }
  marcarSujo();
  await redesenhar();
  return r;
}

// ------------------------------------------------------------------ início
async function abrir() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return mostrarLogin();
  try { await carregar(session); } catch (e) {
    console.error(e);
    mostrarLogin(String(e.message || e));
  }
}
function mostrarLogin(erro) {
  $('#tela-carga').hidden = true; $('#app').hidden = true; $('#tela-login').hidden = false;
  const el = $('#lg-erro'); el.hidden = !erro; el.textContent = erro || '';
  $('#lg-email').focus();
}
$('#form-login').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const bt = $('#form-login button'); bt.disabled = true; bt.textContent = 'Entrando…';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('#lg-email').value.trim(), password: $('#lg-senha').value });
  bt.disabled = false; bt.textContent = 'Entrar';
  if (error) return mostrarLogin(traduz(error.message));
  $('#tela-login').hidden = true; $('#tela-carga').hidden = false;
  try { await carregar(data.session); } catch (e) { mostrarLogin(String(e.message || e)); }
});

async function carregar(session) {
  $('#tela-login').hidden = true; $('#tela-carga').hidden = false;
  setCarga('Carregando o motor de cálculo…');
  await motorPronto;
  setCarga('Lendo a carteira de empresas…');
  const emp = await lerTudo(CONFIG.tabelaCarteira, '*', CONFIG.colNome, 1000);
  const r = await M('iniciar', localStorage.getItem('vt_cfg') || '{}', session.user.email, session.user.id);
  await M('definir_empresas', JSON.stringify(emp));
  setCarga('Baixando as apurações da nuvem…');
  const rows = await lerTudo(CONFIG.tabelaNuvem, 'chave,dados', 'chave', 200);
  setCarga('Calculando as empresas selecionadas…');
  await M('aplicar_nuvem', JSON.stringify(rows));
  $('#comp').value = r.comp;
  $('#menu-user').textContent = session.user.email;
  $('#tela-carga').hidden = true; $('#app').hidden = false;
  setNuvem('ok');
  aplicarLayout();
  await redesenhar();
}

// ------------------------------------------------------------------ tabela de empresas
const COLS_NUM = new Set(['rec', 'calc', 'decl', 'dif', 'fr', 'rbt', 'fx', 'ordem']);
async function desenharTabela() {
  const d = await M('tabela', UI.filtro, UI.busca);
  UI.linhas = d.linhas;
  $$('#chips button').forEach((b) => {
    b.classList.toggle('on', b.dataset.f === UI.filtro);
    b.textContent = { pend: 'Pendentes' + (d.n_pend ? ' ' + d.n_pend : ''), sel: 'Selecionadas ' + d.n_sel, todas: 'Todas ' + d.n_tot, sn: 'Simples', lp: 'Presumido' }[b.dataset.f];
  });
  const { c, dir } = UI.ordem;
  const L = [...d.linhas].sort((a, b) => {
    const x = a[c], y = b[c];
    if (x == null && y == null) return a.nome.localeCompare(b.nome);
    if (x == null) return 1; if (y == null) return -1;
    const r = COLS_NUM.has(c) ? x - y : String(x).localeCompare(String(y), 'pt-BR');
    return (r || a.nome.localeCompare(b.nome)) * dir;
  });
  UI.ordemIds = L.map((l) => l.id);
  $$('#tabela th').forEach((th) => th.classList.toggle('ord-asc', th.dataset.c === c && dir === 1) || th.classList.toggle('ord-desc', th.dataset.c === c && dir === -1));
  $$('#tabela th').forEach((th) => { th.classList.remove('ord-asc', 'ord-desc'); if (th.dataset.c === c) th.classList.add(dir === 1 ? 'ord-asc' : 'ord-desc'); });
  $('#tabela tbody').innerHTML = L.map((l) => {
    const difCls = l.dif == null ? '' : Math.abs(l.dif) >= 0.01 ? 'c-bad b' : 'c-ok';
    const frCls = l.fr != null && l.fr < 0.28 && l.reg === 'SN' ? 'c-warn' : '';
    const pCls = l.pend_sev === 'erro' ? 'c-bad' : l.pend_sev ? 'c-warn' : l.pend.startsWith('✓') ? 'c-ok' : '';
    return `<tr data-id="${l.id}" class="${l.id === UI.atual ? 'sel' : ''} ${l.na ? '' : 'fora'}">
      <td><span class="dot" style="background:${PONTO[l.cod] || PONTO.fora}"></span>${esc(l.sit)}</td>
      <td class="emp" title="${esc(l.razao)}\n${esc(l.cnpj)}">${esc(l.nome)}</td><td class="col-cnpj">${esc(l.cnpj)}</td>
      <td>${REG[l.reg] || esc(l.reg)}</td><td class="n">${fmt(l.rec)}</td><td class="n">${fmt(l.calc)}</td><td class="n">${fmt(l.decl)}</td>
      <td class="n ${difCls}">${fmt(l.dif)}</td><td class="n ${frCls}">${pct(l.fr)}</td><td class="n">${fmt(l.rbt)}</td>
      <td class="n">${l.fx ? l.fx + 'ª' : '—'}</td><td class="pend ${pCls}" title="${esc(l.pend)}">${esc(l.pend)}</td></tr>`;
  }).join('') || `<tr><td colspan="12" class="mut" style="padding:24px">${
    UI.filtro === 'sel' ? 'Nenhuma empresa selecionada: clique em "Todas" e escolha uma.' : UI.filtro === 'pend' ? 'Nenhuma pendência nas empresas selecionadas.' : 'Nenhuma empresa encontrada.'}</td></tr>`;
  const t = d.tot;
  $('#totais').innerHTML = L.length ? `<b>${L.length}</b> empresa(s) · Receita <b>${brl(t.rec)}</b> · Calculado <b>${brl(t.calc)}</b> · Declarado <b>${brl(t.decl)}</b> · Diferença <b class="${Math.abs(t.dif) >= 0.01 ? 'c-bad' : 'c-ok'}">${brl(t.dif)}</b>${d.n_div ? ` <span class="c-bad">(${d.n_div} com diferença)</span>` : ''} <span class="mut">· duplo clique abre a validação · F8 próxima pendente</span>` : '';
  const sel = $('#tabela tr.sel');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
  desenharCompacto();
}
function desenharCompacto() {
  if (!UI.atual) return;
  const ids = UI.ordemIds || [];
  const i = ids.indexOf(UI.atual);
  const l = UI.linhas.find((x) => x.id === UI.atual);
  $('#c-info').innerHTML = l ? `<b>${esc(l.nome)}</b> &nbsp;<span class="dot" style="background:${PONTO[l.cod]}"></span>${esc(l.sit)}${i >= 0 ? ` <span class="mut">· ${i + 1} de ${ids.length} na tabela</span>` : ''}` : '';
  $('#c-ant').disabled = i <= 0; $('#c-prox').disabled = i < 0 || i >= ids.length - 1;
}

$('#chips').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; UI.filtro = b.dataset.f; gravarUI(); desenharTabela(); });
let tBusca;
$('#busca').addEventListener('input', () => { clearTimeout(tBusca); tBusca = setTimeout(() => { UI.busca = $('#busca').value; desenharTabela(); }, 200); });

async function abrirEmpresa(id) {
  UI.atual = String(id);
  $$('#tabela tbody tr').forEach((tr) => tr.classList.toggle('sel', tr.dataset.id === UI.atual));

function andar(d) {

function kpi(r, v, s = '', cls = '') { return `<div class="kpi"><div class="r">${r}</div><div class="v ${cls}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`; }
function desenharResumo(e) {

    <div class="kpis">
      ${kpi('Receita do mês', brl(r.rpa))}
      ${kpi('Tributos calculados', brl(r.calc), r.aliq != null ? 'alíquota efetiva ' + pct(r.aliq, 2) : '')}
      ${kpi('Declarado', brl(r.decl))}
      ${kpi('Diferença', brl(r.dif), '', difCls)}
      ${e.reg === 'SN' ? kpi('Fator R', pct(r.fr), r.rbt12 != null ? 'RBT12 ' + brl(r.rbt12) + (r.faixa ? ' · ' + r.faixa + 'ª faixa' : '') : '') : kpi('Regime', e.reg_rot, r.regra || '')}
    </div>
    <div class="bloco"><h3>O que resolver</h3>${e.pend.length ? e.pend.map((p) => `<div class="pend-item" data-x="${esc(p.id)}">

      : `<p class="mut">${e.s.cod === 'nao' ? 'Sem dados do mês: importe XML/PGDAS-D ou lance as receitas na Apuração.' : 'Nada pendente nesta competência.'}</p>`}</div>

    <div id="log-imp"></div>
    <div class="bloco" style="margin-top:14px"><h3>Notas desta empresa em ${esc(e.comp_rot)}</h3>
      ${e.xml.qtd ? `<p><b>${e.xml.qtd}</b> nota(s) · total <b>${brl(e.xml.total)}</b></p>
        <table class="form"><tr><th>Grupo</th><th class="n" style="text-align:right">Valor</th></tr>${e.xml.grupos.map((g) => `<tr><td>${esc(g.rot)}</td><td class="n">${fmt(g.valor)}</td></tr>`).join('')}</table>`
        : '<p class="mut">Nenhuma nota importada nesta competência.</p>'}
      <p class="mut">PGDAS-D da competência: <b>${e.pgdas ? 'importado' : 'não importado'}</b></p></div>`;
  const inp = $('#in-arq', el), drop = $('#drop', el);
  $('#bt-arq', el).addEventListener('click', () => inp.click());
  inp.addEventListener('change', () => importar([...inp.files]));
  drop.addEventListener('dragover', (ev) => { ev.preventDefault(); drop.classList.add('sobre'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('sobre'));
  drop.addEventListener('drop', (ev) => { ev.preventDefault(); drop.classList.remove('sobre'); importar([...ev.dataTransfer.files]); });
}
async function importar(files) {
  if (!files.length) return;
  const log = $('#log-imp');
  if (log) log.innerHTML = `<p class="mut">Lendo ${files.length} arquivo(s)…</p>`;
  const lista = await Promise.all(files.map(async (f) => [f.name, new Uint8Array(await f.arrayBuffer())]));
  try {
    const r = await M('importar', lista);
    const sem = Object.entries(r.semEmpresa || {});
    const html = `<div class="bloco" style="margin-top:12px"><h3>Importação concluída</h3>
      <p><b>${r.nfe}</b> NF-e/NFC-e · <b>${r.nfse}</b> NFS-e · <b>${r.pgdas.length}</b> PGDAS-D${r.canc ? ` · ${r.canc} cancelada(s)` : ''}${r.compras ? ` · ${r.compras} nota(s) de compra` : ''}</p>
      ${sem.length ? `<p class="c-warn">CNPJ fora da carteira: ${sem.map(([k, v]) => esc(k) + ' (' + esc(v) + ')').join(', ')}</p>` : ''}
      ${r.erros.length ? `<p class="c-bad">Com erro: ${r.erros.map(esc).join(' · ')}</p>` : ''}
      ${r.ignorados.length ? `<p class="mut">Ignorados: ${r.ignorados.map(esc).join(' · ')}</p>` : ''}</div>`;
    marcarSujo();
    await redesenhar();
    const l2 = $('#log-imp'); if (l2) l2.innerHTML = html;
    avisar('Arquivos importados.');
  } catch (e) { if (log) log.innerHTML = `<p class="erro">${esc(e.message)}</p>`; }
}

// etapa 2 — receitas do mês (Simples)
async function etapaReceitas(e, el) {
  const f = await M('form_sn', e.id);
  const trava = e.travada ? 'disabled' : '';
  const optAnexo = (a) => f.anexos.map((x) => `<option ${x === a ? 'selected' : ''}>${x}</option>`).join('');
  el.innerHTML = `
    ${f.xml.length ? `<h3 style="margin-top:0">Receitas das notas (XML)</h3>
      <table class="form"><tr><th>Grupo</th><th style="width:120px">Anexo</th><th class="n" style="width:160px">Valor</th></tr>
      ${f.xml.map((x) => `<tr><td>${esc(x.descricao)}</td><td><select data-xml="${esc(x.g)}" ${trava}>${optAnexo(x.anexo)}</select></td><td class="n">${fmt(x.valor)}</td></tr>`).join('')}</table>` : ''}
    ${f.declaradas.length ? `<p class="mut">Sem lançamento manual: usando o que foi declarado no PGDAS-D (${f.declaradas.length} atividade(s)).</p>` : ''}
    <h3>${f.xml.length ? 'Outras receitas (lançamento manual)' : 'Receitas do mês'}</h3>
    <table class="form" id="tb-rec"><tr><th>Descrição</th><th style="width:110px">Anexo</th><th style="width:150px" class="n">Valor</th>
      <th class="c" title="ICMS por substituição tributária">ST</th><th class="c" title="PIS/Cofins monofásico">Mono</th><th class="c" title="ISS retido na fonte">ISS ret.</th><th class="c" title="Exportação">Exp.</th><th></th></tr>
      ${f.receitas.map((r, i) => `<tr data-i="${i}"><td><input data-k="descricao" value="${esc(r.descricao)}" placeholder="Ex.: Revenda de peças" ${trava}></td>
        <td><select data-k="anexo" ${trava}>${optAnexo(r.anexo || 'I')}</select></td>
        <td><input data-k="valor" class="n" value="${esc(r.valor)}" placeholder="0,00" inputmode="decimal" ${trava}></td>
        ${['icms_st', 'monofasico', 'iss_retido', 'exportacao'].map((k) => `<td class="c"><input type="checkbox" data-k="${k}" ${r[k] ? 'checked' : ''} ${trava}></td>`).join('')}
        <td><button class="ico" data-del="${i}" title="Remover" ${trava}>×</button></td></tr>`).join('')}
    </table>
    <button id="bt-add" class="sec" style="margin-top:8px" ${trava}>+ Adicionar receita</button>
    <div class="linha-campos">
      <label>DAS informado (se não importar o PGDAS-D)<input id="in-das" class="n" value="${esc(f.dasInf)}" placeholder="${f.das_pgdas != null ? fmt(f.das_pgdas) + ' (PGDAS-D)' : '0,00'}" ${trava}></label>
    </div>
    <p class="mut">ST = ICMS por substituição tributária · Mono = PIS/Cofins monofásico · ISS ret. = retido na fonte · Exp. = exportação.
      ${e.travada ? '<br><b>Competência validada:</b> reabra na etapa 5 para alterar.' : ''}</p>`;
  const coletar = () => ({
    receitas: $$('#tb-rec tr[data-i]', el).map((tr) => {
      const o = {}; $$('[data-k]', tr).forEach((i) => (o[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.value)); return o;
    }),
    dasInf: $('#in-das', el).value,
    anexoXml: Object.fromEntries($$('[data-xml]', el).map((s) => [s.dataset.xml, s.value])),
  });
  const salvar = async (patch) => { await mudar('salvar_form_sn', e.id, JSON.stringify(patch || coletar())); };
  el.addEventListener('change', (ev) => { if (ev.target.matches('input,select')) salvar(); });
  $('#bt-add', el).addEventListener('click', () => { const p = coletar(); p.receitas.push({ descricao: '', anexo: 'I', valor: '' }); salvar(p); });
  $$('[data-del]', el).forEach((b) => b.addEventListener('click', () => { const p = coletar(); p.receitas.splice(+b.dataset.del, 1); salvar(p); }));
}

// etapa 3 — RBT12 e folha (Simples)
async function etapaRbt12(e, el) {
  const f = await M('form_sn', e.id);
  const trava = e.travada ? 'disabled' : '';
  const tot = f.meses.reduce((s, m) => s + (m.hist_ef || 0), 0);
  el.innerHTML = `
    <div class="linha-campos">
      <label>Início das atividades<input id="in-ini" type="month" value="${esc(f.inicio)}" ${trava}></label>
      <span class="mut">${f.inicio_ef ? 'em uso: ' + esc(f.inicio_ef) : ''}</span>
      <label>RBT12 informada (opcional)<input id="in-rbt" class="n" value="${esc(f.rbt12)}" placeholder="calculada pelos meses" ${trava}></label>
      <label>Folha 12 meses — total (opcional)<input id="in-f12" class="n" value="${esc(f.folha12)}" placeholder="pelos meses abaixo" ${trava}></label>
    </div>
    <table class="form" id="tb-meses"><tr><th>Mês</th><th class="n" style="width:200px">Receita bruta</th><th>Origem</th><th class="n" style="width:200px">Folha (salários + pró-labore + encargos)</th><th></th></tr>
      ${f.meses.map((m) => `<tr data-m="${m.m}"><td><b>${esc(m.rot)}</b></td>
        <td><input data-k="hist" class="n" value="${esc(m.hist)}" placeholder="${m.hist_ef != null ? fmt(m.hist_ef) : '0,00'}" ${trava}></td>
        <td class="origem">${esc(m.hist)?'manual':esc(m.hist_or || '')}</td>
        <td><input data-k="folha" class="n" value="${esc(m.folha)}" placeholder="${m.folha_ef != null ? fmt(m.folha_ef) : '0,00'}" ${trava}></td><td></td></tr>`).join('')}
      <tr><td><b>Total 12 meses</b></td><td class="n"><b>${fmt(tot)}</b></td><td></td><td class="n"><b>${fmt(f.folha_12m)}</b></td><td class="origem">${esc(f.origemFolha || '')}</td></tr>
    </table>
    <p class="mut">Os valores em cinza vêm do PGDAS-D, de apurações salvas ou dos XML. Digite só o que quiser corrigir; apagar volta para a origem automática.</p>`;
  const coletar = () => {
    const hist = {}, folha = {};
    $$('#tb-meses tr[data-m]', el).forEach((tr) => { hist[tr.dataset.m] = $('[data-k=hist]', tr).value; folha[tr.dataset.m] = $('[data-k=folha]', tr).value; });
    return { inicio: $('#in-ini', el).value, rbt12: $('#in-rbt', el).value, folha12: $('#in-f12', el).value, hist, folha };
  };
  el.addEventListener('change', (ev) => { if (ev.target.matches('input')) mudar('salvar_form_sn', e.id, JSON.stringify(coletar())); });
}

// etapa 5 — validação
async function etapaValidacao(e, el) {
  const v = await M('validacao', e.id);
  el.innerHTML = `<div style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px">
      ${v.travada ? '<button id="bt-reabrir" class="sec">Reabrir competência</button>' : '<button id="bt-concluir" class="pri">Concluir validação</button>'}
      <button id="bt-rel" class="sec">Imprimir relatório</button></div>
    <div class="doc">${v.html}</div>`;
  ligarLinks(el);
  const c = $('#bt-concluir', el), ra = $('#bt-reabrir', el);
  c && c.addEventListener('click', async () => { const r = await mudar('concluir', e.id); if (r && r.ok) avisar('Competência validada.'); });
  ra && ra.addEventListener('click', async () => { await mudar('reabrir', e.id); avisar('Competência reaberta.'); });
  $('#bt-rel', el).addEventListener('click', () => imprimir('validacao', e.id));
}

/** Links dentro do HTML do motor: just:, desjust:, acao:, irpa: (iguais aos do programa). */
function ligarLinks(el) {
  el.querySelectorAll('.doc a[href]').forEach((a) => a.addEventListener('click', async (ev) => {
    const h = a.getAttribute('href');
    if (/^https?:/.test(h)) return;
    ev.preventDefault();
    if (h.startsWith('just:')) return justificar(h.slice(5));
    if (h.startsWith('desjust:')) return mudar('desfazer_just', UI.atual, h.slice(8));
    if (h.startsWith('irpa:')) return irComp(h.slice(5));
    if (h.startsWith('acao:')) {
      const x = h.slice(5);
      if (/^\d$/.test(x)) { UI.aba = 'apuracao'; UI.etapa = +x; return desenharEmpresa().then(aplicarLayout); }
      if (x === 'aba:memoria') { UI.aba = 'apuracao'; UI.etapa = 4; return desenharEmpresa().then(aplicarLayout); }
      if (x.startsWith('aba:')) { UI.aba = 'apuracao'; UI.etapa = 5; return desenharEmpresa().then(aplicarLayout); }
      if (x.startsWith('comp:')) return irComp(x.slice(5));
      if (x === 'importar') { UI.aba = 'apuracao'; UI.etapa = 1; return desenharEmpresa().then(aplicarLayout); }
      return avisar('Esta ação fica no programa desktop (' + x + ').');
    }
    if (h.startsWith('delap:') || h.startsWith('delpg:')) return avisar('Excluir apurações/PGDAS continua no programa desktop.');
  }));
}
async function justificar(xid) {
  const x = await M('checagem', UI.atual, xid);
  if (!x) return;
  const erro = x.sev === 'erro';
  modal(`<h3>${erro ? 'Justificar divergência' : 'Marcar como revisado'}</h3><p><b>${esc(x.titulo)}</b></p>
    <textarea id="txt-just" placeholder="${erro ? 'Descreva o motivo (mínimo 10 caracteres)' : 'Observação (opcional)'}"></textarea>
    <p id="err-just" class="erro" hidden></p>
    <div class="modal-bts"><button class="sec" id="mj-c">Cancelar</button><button class="pri" id="mj-ok">${erro ? 'Justificar' : 'Marcar revisado'}</button></div>`,
  (m) => {
    $('#txt-just', m).focus();
    $('#mj-c', m).onclick = fecharModal;
    $('#mj-ok', m).onclick = async () => {
      const t = $('#txt-just', m).value.trim();
      if (erro && t.length < 10) { const p = $('#err-just', m); p.hidden = false; p.textContent = 'Descreva a justificativa (mínimo 10 caracteres).'; return; }
      const r = await M('justificar', UI.atual, xid, t);
      if (r.ok === false) { const p = $('#err-just', m); p.hidden = false; p.textContent = r.erro; return; }
      fecharModal(); marcarSujo(); await redesenhar();
    };
  });
}
async function imprimir(tipo, id) {
  const w = window.open('', '_blank');
  const r = await M('relatorio', tipo, id || null);
  if (!r.ok) { w && w.close(); return avisar(r.erro); }
  if (!w) return avisar('O navegador bloqueou a nova aba. Libere pop-ups para este site.');
  w.document.open(); w.document.write(r.html.split('/logo_navy.png').join(LOGO)); w.document.close();
}

// ------------------------------------------------------------------ competência
async function irComp(c) {
  $('#comp').value = c;
  $('#comp-rot').textContent = nomeMes(c);
  await M('definir_comp', c);
  await redesenhar();
}
$('#comp').addEventListener('change', () => $('#comp').value && irComp($('#comp').value));
$('#comp-rot').addEventListener('click', () => { try { $('#comp').showPicker(); } catch (_) { $('#comp').focus(); } });
$('#comp-ant').addEventListener('click', () => irComp(mesAdd($('#comp').value, -1)));
$('#comp-prox').addEventListener('click', () => irComp(mesAdd($('#comp').value, 1)));

// ------------------------------------------------------------------ menu, nuvem, layout, atalhos
$('#bt-menu').addEventListener('click', (e) => { e.stopPropagation(); $('#menu').hidden = !$('#menu').hidden; });
document.addEventListener('click', () => ($('#menu').hidden = true));
$('#menu').addEventListener('click', async (e) => {
  const a = e.target.closest('button')?.dataset.acao; if (!a) return;
  if (a === 'sair') { await enviar(); await sb.auth.signOut(); location.reload(); }
  if (a === 'atualizar') atualizarNuvem();
  if (a === 'rel-carteira') imprimir('carteira');
  if (a === 'tamanho') {
    const op = [14, 15, 16.5, 18]; UI.fs = op[(op.indexOf(UI.fs) + 1) % op.length];
    document.documentElement.style.setProperty('--fs', UI.fs + 'px'); gravarUI(); aplicarLayout();
  }
});
async function atualizarNuvem() {
  await enviar();
  setNuvem('salvando', 'Baixando…');
  try {
    const rows = await lerTudo(CONFIG.tabelaNuvem, 'chave,dados', 'chave', 200);
    await M('atualizar_nuvem', JSON.stringify(rows));
    setNuvem('ok'); await redesenhar(); avisar('Dados atualizados da nuvem.');
  } catch (e) { setNuvem('erro', e.message); avisar(e.message, 6000); }
}
$('#bt-nuvem').addEventListener('click', () => (sujo ? enviar() : atualizarNuvem()));
$('#bt-proxima').addEventListener('click', proximaPendente);
$('#c-pend').addEventListener('click', proximaPendente);
$('#c-ant').addEventListener('click', () => andar(-1));
$('#c-prox').addEventListener('click', () => andar(1));
$('#bt-mostrar').addEventListener('click', () => { UI.tabelaAberta = true; gravarUI(); aplicarLayout(); });
$('#bt-recolher').addEventListener('click', () => { UI.tabelaAberta = false; gravarUI(); aplicarLayout(); });
const ampliar = (on) => document.body.classList.toggle('ampliado', on ?? !document.body.classList.contains('ampliado'));
$('#ap-ampliar').addEventListener('click', () => ampliar());

// divisória arrastável entre a tabela e a empresa
$('#divisor').addEventListener('mousedown', (ev) => {
  ev.preventDefault();
  const m = $('#mestre'), y0 = ev.clientY, h0 = m.getBoundingClientRect().height;
  const mover = (e) => { const h = Math.max(140, Math.min(window.innerHeight - 220, h0 + e.clientY - y0)); m.style.height = h + 'px'; UI.alturaMestre = h; };
  const soltar = () => { document.removeEventListener('mousemove', mover); document.removeEventListener('mouseup', soltar); gravarUI(); };
  document.addEventListener('mousemove', mover); document.addEventListener('mouseup', soltar);
});

document.addEventListener('keydown', (e) => {
  const digitando = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === 'F8') { e.preventDefault(); proximaPendente(); }
  else if (e.key === 'F11') { e.preventDefault(); ampliar(); }
  else if (e.key === 'Escape') { if (!$('#modal-fundo').hidden) fecharModal(); else ampliar(false); }
  else if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); andar(-1); }
  else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); andar(1); }
  else if (e.ctrlKey && (e.key === 't' || e.key === 'T') && UI.aba === 'apuracao') { e.preventDefault(); UI.tabelaAberta = !UI.tabelaAberta; gravarUI(); aplicarLayout(); }
  else if (!digitando && e.key === '/') { e.preventDefault(); $('#busca').focus(); }
  else if (!digitando && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && !$('#mestre-cheio').hidden) { e.preventDefault(); andar(e.key === 'ArrowDown' ? 1 : -1); }
});
window.addEventListener('resize', aplicarLayout);
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.reload(); });

abrir().catch((e) => mostrarLogin(String(e.message || e)));

</script>
